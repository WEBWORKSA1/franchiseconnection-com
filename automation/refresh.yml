# Optional daily refresh job.
# To switch it on: in GitHub, Add file -> Create new file, name it
#   .github/workflows/refresh.yml
# and paste this file's contents. (It is parked here because workflow files can
# only be added by the repo owner.)
# GitHub Pages rebuilds the site with Jekyll automatically after every commit,
# so this job only refreshes data and missing images; it never touches pages.
name: Refresh site data

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Category data
        run: python tools/make_concepts.py
      - name: Images (only if missing)
        run: |
          if [ ! -f assets/img/og.png ] || [ ! -f assets/img/logo.png ]; then
            pip install --quiet pillow
            python tools/make_images.py
          fi
      - name: Fetch franchise headlines
        run: python tools/fetch_news.py
      - name: Commit changes
        run: |
          git config user.name "franchiseconnection-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh data: headlines, categories, images"
          git push
